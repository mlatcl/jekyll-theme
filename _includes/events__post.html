<a class="news-events__post row row--justified" href="{{ post.url }}">
    <div class="news-events__post-image column-m-12-nest column-t-4-nest">
        {% if post.image and post.image != "" %}
          {% assign card_image = post.image %}
        {% else %}
          {% assign card_image = post.featured_image %}
        {% endif %}
        {% if card_image contains "/" %}
        <img src="{{ card_image | relative_url }}" alt="">
        {% else %}
        <img src="{{site.data.images.directory | relative_url }}/{{ card_image }}" alt="">
        {% endif %}
        <p class="post-date">{{ post.event_date | date: "%-d %B %Y" }}</p>
    </div>
    <div class="news-events__post-content column-m-12-nest column-t-8-nest">
        <div>
            <h3>{{ post.title}}</h3>
            <p>{{ post.excerpt }}</p>
        </div>
        <div class="button">
            Read More
            <span class="dot dot--top-left"></span>
            <span class="dot dot--top-right"></span>
            <span class="dot dot--bottom-left"></span>
            <span class="dot dot--bottom-right"></span>
        </div>
    </div>
</a>
